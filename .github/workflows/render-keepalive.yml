name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render keep-alive endpoint
        env:
          KEEPALIVE_URL: https://exchange-shared.onrender.com/ping
        run: |
          curl --silent --show-error --fail \
            --request GET \
            --connect-timeout 30 \
            --max-time 90 \
            --retry 4 \
            --retry-delay 15 \
            --retry-all-errors \
            --retry-connrefused \
            --output /dev/null \
            "$KEEPALIVE_URL"
